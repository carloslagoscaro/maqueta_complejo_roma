<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horario por Cancha y Espacio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Scrollbar sutil para vista desktop */
    .custom-scrollbar::-webkit-scrollbar {
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #141416;
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #2e2e32;
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #45454b;
    }
  </style>
</head>
<body class="bg-[#0d0d0f] text-zinc-100 antialiased p-4 sm:p-6 md:p-8">

  <section class="max-w-6xl mx-auto">
    <!-- Encabezado de la sección -->
    <div class="mb-5">
      <div class="flex items-start sm:items-center gap-2.5">
        <span class="text-emerald-400 text-lg leading-none mt-0.5 sm:mt-0">📅</span>
        <h2 class="text-amber-300 font-bold text-sm sm:text-base tracking-wide uppercase leading-snug">
          Horario independiente por cancha (1 a 6) y espacio de eventos
        </h2>
      </div>
      <p class="text-zinc-400 text-xs sm:text-sm mt-1.5 ml-7 sm:ml-0">
        26/11/2026 &bull; Solo informativo
      </p>
    </div>

    <!-- ===================================================================
         VISTA MOBILE (< 768px): Tarjetas individuales sin scroll horizontal
         =================================================================== -->
    <div id="mobile-schedule" class="grid grid-cols-1 gap-3.5 md:hidden">
      <!-- Se renderiza dinámicamente mediante JS -->
    </div>

    <!-- ===================================================================
         VISTA DESKTOP (>= 768px): Tabla matricial con columna fija
         =================================================================== -->
    <div class="hidden md:block bg-[#121214] border border-zinc-800/80 rounded-xl overflow-hidden shadow-lg">
      <div class="overflow-x-auto custom-scrollbar">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr id="desktop-table-head" class="border-b border-zinc-800/80 text-[11px] font-semibold tracking-wider text-zinc-400 uppercase bg-[#161619]">
              <th class="sticky left-0 z-20 bg-[#161619] py-3.5 px-4 min-w-[210px] border-r border-zinc-800/80">
                Cancha / Espacio
              </th>
              <!-- Horas inyectadas por JS -->
            </tr>
          </thead>
          <tbody id="desktop-table-body" class="divide-y divide-zinc-800/70 text-sm">
            <!-- Filas inyectadas por JS -->
          </tbody>
        </table>
      </div>
    </div>
  </section>

  <script>
    const horas = [
      "10:00", "11:00", "12:00", "13:00", "14:00",
      "15:00", "16:00", "17:00", "18:00", "19:00", "20:00", "21:00"
    ];

    const espacios = [
      { nombre: "Cancha 1", tipo: "cancha", estados: Array(12).fill("Pasada") },
      { nombre: "Cancha 2", tipo: "cancha", estados: Array(12).fill("Pasada") },
      { nombre: "Cancha 3", tipo: "cancha", estados: Array(12).fill("Pasada") },
      { nombre: "Cancha 4", tipo: "cancha", estados: Array(12).fill("Pasada") },
      { nombre: "Cancha 5", tipo: "cancha", estados: Array(12).fill("Pasada") },
      { nombre: "Cancha 6", tipo: "cancha", estados: Array(12).fill("Pasada") },
      { nombre: "Espacio de Eventos", tipo: "evento", estados: Array(12).fill("Pasada") }
    ];

    function getBadgeStyle(estado) {
      switch (estado.toLowerCase()) {
        case "disponible":
          return "bg-emerald-500/10 text-emerald-400 border-emerald-500/30";
        case "reservada":
          return "bg-rose-500/10 text-rose-400 border-rose-500/30";
        default: // Pasada
          return "bg-[#19191c] text-zinc-500 border-zinc-800";
      }
    }

    function getIcono(tipo) {
      if (tipo === "evento") {
        return `<span class="text-amber-400 text-base">🥂</span>`;
      }
      return `<span class="text-emerald-400 text-base">⚽</span>`;
    }

    // 1. Renderizar Vista Mobile (Tarjetas)
    const mobileContainer = document.getElementById("mobile-schedule");
    espacios.forEach((espacio) => {
      const esEvento = espacio.tipo === "evento";
      const slotsHTML = horas.map((hora, idx) => {
        const estado = espacio.estados[idx];
        return `
          <div class="flex flex-col items-center justify-center py-2 px-1.5 rounded-lg border ${getBadgeStyle(estado)}">
            <span class="text-[11px] font-semibold text-zinc-300 mb-0.5">${hora}</span>
            <span class="text-[10px] leading-tight">${estado}</span>
          </div>
        `;
      }).join("");

      mobileContainer.innerHTML += `
        <article class="bg-[#121214] border border-zinc-800/80 rounded-xl p-4 shadow-sm">
          <div class="flex items-center justify-between pb-3 mb-3 border-b border-zinc-800/70">
            <div class="flex items-center gap-2.5">
              ${getIcono(espacio.tipo)}
              <h3 class="font-semibold text-sm ${esEvento ? 'text-amber-300' : 'text-zinc-100'}">
                ${espacio.nombre}
              </h3>
            </div>
            <span class="text-[11px] text-zinc-500">${horas.length} bloques</span>
          </div>
          <div class="grid grid-cols-4 gap-2">
            ${slotsHTML}
          </div>
        </article>
      `;
    });

    // 2. Renderizar Vista Desktop (Tabla)
    const tableHead = document.getElementById("desktop-table-head");
    horas.forEach((hora) => {
      tableHead.innerHTML += `
        <th class="py-3.5 px-3 text-center min-w-[84px]">${hora}</th>
      `;
    });

    const tableBody = document.getElementById("desktop-table-body");
    espacios.forEach((espacio) => {
      const esEvento = espacio.tipo === "evento";
      const celdasHTML = espacio.estados.map((estado) => `
        <td class="p-2.5 text-center">
          <span class="inline-block w-full py-1.5 px-2.5 rounded-md border text-xs font-medium ${getBadgeStyle(estado)}">
            ${estado}
          </span>
        </td>
      `).join("");

      tableBody.innerHTML += `
        <tr class="hover:bg-zinc-900/40 transition-colors">
          <td class="sticky left-0 z-10 bg-[#121214] py-3 px-4 font-medium border-r border-zinc-800/80">
            <div class="flex items-center gap-2.5">
              ${getIcono(espacio.tipo)}
              <span class="${esEvento ? 'text-amber-300' : 'text-zinc-100'}">${espacio.nombre}</span>
            </div>
          </td>
          ${celdasHTML}
        </tr>
      `;
    });
  </script>
</body>
</html>
